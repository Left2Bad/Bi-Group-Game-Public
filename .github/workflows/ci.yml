name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
  browser:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run test:e2e:dynamic
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: docker compose up --build --wait --wait-timeout 120
      - run: npm run test:http
      - run: npm run test:e2e:container
      - run: docker compose restart
      - run: docker compose up --wait --wait-timeout 120
      - run: npm run test:http
      - run: docker compose logs
        if: failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: container-browser-traces
          path: test-results/
      - run: docker compose down
        if: always()
